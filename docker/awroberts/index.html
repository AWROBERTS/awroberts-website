<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>awroberts</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <!-- Basic SEO -->
  <meta name="description" content="awroberts — portfolio">

  <!-- Open Graph (Link Previews) -->
  <meta property="og:title" content="awroberts">
  <meta property="og:description" content="portfolio">
  <meta property="og:image" content="https://awroberts.co.uk/background-poster.png">
  <meta property="og:url" content="https://awroberts.co.uk/">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
</head>

<body>

  <!--
    This wraps the video tag inside a full-screen, unclickable overflow clip layer.
    By setting the video width/height to 100% and opacity to 0.01, the mobile OS
    declares it "actively visible in the viewport" and unlocks the hardware acceleration
    chip thread, allowing p5.js to parse the pixel matrix smoothly!
  -->
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: -2;">
    <video id="bg-video"
           muted
           playsinline
           autoplay
           crossorigin="anonymous"
           style="display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0.01;">
    </video>
  </div>

  <div id="canvas-container" style="position: relative; z-index: 1;"></div>

  <!-- Correct way to load a p5 module -->
  <script type="module">
    import sketch from "/sketch/sketch.js";
    new p5(sketch);
  </script>

</body>
</html>
