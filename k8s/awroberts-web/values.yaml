replicaCount: 1

image:
  repository: docker.io/library/awroberts
  tag: latest
  pullPolicy: Never

traefik:
  hostnames:
    - awroberts.co.uk
    - www.awroberts.co.uk
  tls:
    secretName: awroberts-tls
  hsts:
    maxAge: 31536000
    includeSubdomains: true

gateway:
  name: awroberts-web-deploy-gateway
  namespace: awroberts
  className: traefik
  hostnames:
    root: awroberts.co.uk
    wildcard: "*.awroberts.co.uk"

stream:
  pathPrefix: /stream

media:
  hostPath: /var/www/html/awroberts/awroberts-media
  mountPath: /var/www/html/awroberts/awroberts-media

assets:
  fallbackImage: background-poster.png
  fallbackImagePublicPath: /fallback/background.png
  fallbackCacheControl: "public, max-age=604800"

  fontFile: CURWENFONT.ttf
  fontPublicPath: /awroberts-media/CURWENFONT.ttf
  fontCacheControl: "public, max-age=31536000, immutable"

  publicPath: /assets
  mountPath: /usr/share/nginx/html/assets

# /deployment.json for the site's diagnostics panel. The ConfigMap
# (<fullname>-deployment-json) is created by the deploy script, not Helm.
deploymentJson:
  mountPath: /etc/awroberts/deployment-json

nginx:
  workerProcesses: 1
  workerConnections: 1024
  keepaliveTimeout: 65
  listenPort: 80
  serverName: "_"
  root: /usr/share/nginx/html
  index: index.html

  # Cache for /stream/ proxied from the background nginx on the worker VM,
  # so each segment crosses the VM link once rather than once per viewer.
  streamCache:
    path: /var/cache/nginx/stream
    maxSize: 400m          # emptyDir sizeLimit is set slightly above this
    sizeLimit: 512Mi
    # Live window is liveWindow x segmentDuration (20s); keep segments a bit
    # longer than that. ffmpeg restarts reuse segment names, so don't go long.
    segmentTtl: 30s
    # Playlists change every segment; 1s still collapses concurrent viewers.
    playlistTtl: 1s

  mimeTypes:
    ttf: "font/ttf"
    otf: "font/otf"
    woff: "font/woff"
    woff2: "font/woff2"

containerPort: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 80
  initialDelaySeconds: 2
  periodSeconds: 5

service:
  type: ClusterIP
  port: 80
  portName: http
  protocol: TCP

autoscaling:
  enabled: false

backgroundVideo:
  source: "/usr/share/nginx/html/hls/stream.m3u8"

  ffmpeg:
    image:
      repository: jrottenberg/ffmpeg
      tag: "8.1-scratch"
      pullPolicy: IfNotPresent

  nginx:
    image:
      repository: docker.io/library/background-video
      tag: latest
      pullPolicy: Never

    volume:
      name: hls-output
      hostPath: /var/www/html/awroberts/awroberts-media

  desktop:
    enabled: true
    scale: "3840:2160"       # Force strict 4K parameter formatting (replaces "3840:-1")
    bitrate: "14000k"        # Bumped from 8000k to 14Mbps to handle true 4K canvas data
    maxrate: "16000k"        # Expanded ceiling to capture rich camera loop details
    bufsize: "32000k"        # Increased allocation to match the 14Mbps profile
    preset: "medium"         # Swapped from "veryfast" to "medium" to stop detail pixelation

  hls:
    segmentDuration: 2       # Strictly lock to your fresh 2-second segment chunks
    liveWindow: 6            # Tightened sliding live window size from 10 down to 6 segments
    liveSegmentPrefix: "live_"
    outputDir: "/var/www/html/awroberts/awroberts-media/stream"

  resources:
    # Real-time 4K libx264: x264 frame buffers alone exceed 512Mi, and it
    # needs several cores to keep up with -re.
    ffmpegDesktop:
      requests:
        cpu: 1500m
        memory: 1536Mi
      limits:
        cpu: 3500m
        memory: 3Gi

    ffmpegMobile:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    nginx:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  mobile:
    enabled: true
    scale: "1280:-1"
    bitrate: "900k"
    maxrate: "1000k"
    bufsize: "1500k"
    audioBitrate: "128k"
    liveWindow: 10
    outputDir: "/var/www/html/awroberts/awroberts-media/stream/mobile"
    segmentPrefix: "mobile_"
    preset: "fast"
