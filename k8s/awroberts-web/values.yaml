replicaCount: 1

image:
  repository: docker.io/library/awroberts
  tag: latest
  pullPolicy: Never

traefik:
  hostnames:
    - awroberts.co.uk
    - www.awroberts.co.uk
  tls:
    secretName: awroberts-tls
  hsts:
    maxAge: 31536000
    includeSubdomains: true

gateway:
  name: awroberts-web-deploy-gateway
  namespace: awroberts
  className: traefik
  hostnames:
    root: awroberts.co.uk
    wildcard: "*.awroberts.co.uk"

stream:
  pathPrefix: /stream

media:
  hostPath: /var/www/html/awroberts/awroberts-media
  mountPath: /var/www/html/awroberts/awroberts-media

assets:
  fallbackImage: background-poster.png
  fallbackImagePublicPath: /fallback/background.png
  fallbackCacheControl: "public, max-age=604800"

  fontFile: CURWENFONT.ttf
  fontPublicPath: /awroberts-media/CURWENFONT.ttf
  fontCacheControl: "public, max-age=31536000, immutable"

  publicPath: /assets
  mountPath: /usr/share/nginx/html/assets

deploymentJson:
  mountPath: /etc/awroberts/deployment-json

nginx:
  workerProcesses: 1
  workerConnections: 1024
  keepaliveTimeout: 65
  listenPort: 80
  serverName: "_"
  root: /usr/share/nginx/html
  index: index.html

  streamCache:
    path: /var/cache/nginx/stream
    maxSize: 400m
    sizeLimit: 512Mi
    segmentTtl: 30s
    playlistTtl: 1s

  mimeTypes:
    ttf: "font/ttf"
    otf: "font/otf"
    woff: "font/woff"
    woff2: "font/woff2"

containerPort: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 80
  initialDelaySeconds: 2
  periodSeconds: 5

service:
  type: ClusterIP
  port: 80
  portName: http
  protocol: TCP

autoscaling:
  enabled: false

backgroundVideo:
  # Desktop configuration track (Master live stream engine source)
  source: "/usr/share/nginx/html/hls/stream.m3u8"

  ffmpeg:
    image:
      repository: jrottenberg/ffmpeg
      tag: "8.1-scratch"
      pullPolicy: IfNotPresent

  nginx:
    image:
      repository: docker.io/library/background-video
      tag: latest
      pullPolicy: Never
    volume:
      # High-speed shared host memory volume roots
      shmRootPath: "/dev/shm/awroberts-media"
      shmStreamPath: "/dev/shm/awroberts-media/stream"

  desktop:
    enabled: true

  mobile:
    enabled: false           # Safely disabled permanently

  hls:
    segmentDuration: 2
    liveWindow: 15
    liveSegmentPrefix: "live_"
    outputDir: "/var/www/html/awroberts/awroberts-media/stream"

  resources:
    ffmpegDesktop:
      requests:
        cpu: 1500m
        memory: 1536Mi
      limits:
        cpu: 3500m
        memory: 3Gi
    nginx:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
