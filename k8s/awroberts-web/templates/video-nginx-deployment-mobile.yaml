{{- if .Values.backgroundVideo.mobile.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "awroberts.fullname" . }}-background-ffmpeg-mobile
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "awroberts.fullname" . }}-background-ffmpeg-mobile
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: background-ffmpeg-mobile

spec:
  replicas: {{ .Values.replicaCount | default 1 }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "awroberts.fullname" . }}-background-ffmpeg-mobile
      app.kubernetes.io/component: background-ffmpeg-mobile
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "awroberts.fullname" . }}-background-ffmpeg-mobile
        app.kubernetes.io/component: background-ffmpeg-mobile
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      terminationGracePeriodSeconds: 10

      nodeSelector:
        kubernetes.io/arch: arm64

      containers:
        - name: ffmpeg-mobile
          image: "{{ .Values.backgroundVideo.ffmpeg.image.repository }}:{{ .Values.backgroundVideo.ffmpeg.image.tag }}"
          imagePullPolicy: {{ .Values.backgroundVideo.ffmpeg.image.pullPolicy }}

          command:
            - /bin/sh
            - -c
            - |
              set -u

              # Dynamically pull configurations from your Helm variables
              OUTPUT_DIR="{{ .Values.backgroundVideo.nginx.volume.shmMobileStreamPath }}"
              SEGMENT_PREFIX="{{ .Values.backgroundVideo.mobile.segmentPrefix }}"

              mkdir -p "$OUTPUT_DIR"

              # ----------------------------------------------------
              # HIGH-PERFORMANCE ZERO-OVERHEAD MOBILE COPY ENGINE
              # ----------------------------------------------------
              ffmpeg -y \
                -re \
                -stream_loop -1 \
                -i {{ .Values.backgroundVideo.mobileSource }} \
                -c:v copy \
                -c:a aac -b:a 128k \
                -f hls \
                -hls_time {{ .Values.backgroundVideo.hls.segmentDuration }} \
                -hls_list_size {{ .Values.backgroundVideo.mobile.liveWindow }} \
                -hls_flags delete_segments+omit_endlist \
                -hls_segment_filename "$OUTPUT_DIR/${SEGMENT_PREFIX}%03d.ts" \
                "$OUTPUT_DIR/index.m3u8"

          volumeMounts:
            - name: hls-input
              mountPath: /usr/share/nginx/html/hls

            - name: hls-output-mobile
              mountPath: {{ .Values.backgroundVideo.nginx.volume.shmMobileStreamPath }}

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      volumes:
        - name: hls-input
          hostPath:
            path: {{ .Values.media.hostPath }}/hls
            type: Directory

        # Maps mobile segments cleanly into your host's shared memory highway
        - name: hls-output-mobile
          hostPath:
            path: {{ .Values.backgroundVideo.nginx.volume.shmMobileStreamPath }}
            type: DirectoryOrCreate
{{- end }}
