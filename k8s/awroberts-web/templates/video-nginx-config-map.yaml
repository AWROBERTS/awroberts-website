apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "awroberts.fullname" . }}-background-nginx
data:
  nginx.conf: |
    worker_processes {{ .Values.nginx.workerProcesses | default 1 }};

    events {
        worker_connections {{ .Values.nginx.workerConnections | default 1024 }};
    }

    http {
        include mime.types;
        default_type application/octet-stream;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 m4s;
        }

        sendfile on;
        keepalive_timeout {{ .Values.nginx.keepaliveTimeout | default 65 }};

        server {
            listen {{ .Values.nginx.listenPort | default 80 }};
            listen [::]:{{ .Values.nginx.listenPort | default 80 }};
            server_name "_";

            # Serve HLS output directory
            root "{{ .Values.backgroundVideo.hls.outputDir }}";

            # Health check
            location "{{ .Values.livenessProbe.httpGet.path }}" {
                return 200;
            }

            # Poster image (served from same HLS directory)
            location = /background-poster.png {
                alias /var/www/html/awroberts/awroberts-media/background-poster.png;
                add_header Cache-Control "no-cache";
            }

            # The main site proxies /stream/... through unchanged, so map that
            # prefix onto the output dir (root alone would look in stream/stream/).
            location /stream/ {
                # No try_files here: it misbehaves with alias; missing files 404 anyway.
                alias "{{ .Values.backgroundVideo.hls.outputDir }}/";
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

                # ----------------------------------------------------
                # HIGH-BITRATE 4K STATIC FILE OPTIMIZATIONS
                # ----------------------------------------------------
                # Tells the Linux kernel to allocate larger RAM buffers when reading
                # your massive uncompressed 4K .ts segments from the shared disk volume.
                output_buffers 4 1024k;

                # Maximise memory packet sizes to send data across the hypervisor instantly
                sendfile_max_chunk 512k;
                tcp_nopush on;
                tcp_nodelay on;
            }

            # Serve all HLS files directly
            location / {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                try_files $uri =404;
            }
        }
    }
